name: Verify
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vindex_test
          POSTGRES_PASSWORD: vindex_test
          POSTGRES_DB: vindex_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vindex_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
      TEST_DATABASE_URL: postgresql+psycopg://vindex_test:vindex_test@127.0.0.1:5432/vindex_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.19'
          python-version: '3.12'
      - run: uv sync --frozen
      - run: uv run ruff check backend scripts
      - run: uv run ruff format --check backend scripts
      - run: uv run mypy
      - run: uv run pytest
      - run: uv run alembic upgrade head
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
