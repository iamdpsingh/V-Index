name: Verify
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vindex_test
          POSTGRES_PASSWORD: vindex_test
          POSTGRES_DB: vindex_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vindex_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
      TEST_DATABASE_URL: postgresql+psycopg://vindex_test:vindex_test@127.0.0.1:5432/vindex_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.19'
          python-version: '3.12'
      - run: uv sync --frozen
      - run: uv run ruff check backend scripts
      - run: uv run ruff format --check backend scripts
      - run: uv run mypy
      - run: uv run pytest
      - run: uv run alembic upgrade head
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build

  stack:
    runs-on: ubuntu-latest
    env:
      ADMIN_TOKEN: ci-stack-only-token
      PUBLIC_WEB_ORIGIN: http://localhost:3000
      ACCOUNT_REGISTRATION_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Generate an ephemeral private-resume key
        run: |
          python3 - <<'PYTHON'
          import base64, os
          from pathlib import Path
          target = Path('.env')
          target.write_text('RESUME_ENCRYPTION_KEY=' + base64.urlsafe_b64encode(os.urandom(32)).decode() + '\n')
          target.chmod(0o600)
          PYTHON
      - name: Build and launch the actual stack
        run: docker compose up --build -d
      - name: Check API, database, Redis and web proxy
        run: |
          curl -fsS --retry 15 --retry-all-errors --retry-delay 2 --max-time 5 --retry-max-time 60 http://127.0.0.1:8000/health
          curl -fsS --retry 15 --retry-all-errors --retry-delay 2 --max-time 5 --retry-max-time 60 http://127.0.0.1:3000/ -o /dev/null
          curl -fsS http://127.0.0.1:3000/api/v1/jobs | python3 -c 'import json,sys; data=json.load(sys.stdin); assert data["total"] == 0 and data["items"] == []'
          curl -fsS http://127.0.0.1:3000/openapi.json | python3 -c 'import json,sys; data=json.load(sys.stdin); assert "/api/v1/jobs" in data["paths"]'
          docker compose exec -T redis redis-cli ping
          docker compose exec -T api /app/.venv/bin/alembic current
          test "$(docker compose ps --status running -q worker | wc -l | tr -d ' ')" = 1
      - name: Check private account/profile/resume APIs through the web proxy
        run: python3 scripts/check_private_stack.py
      - name: Capture service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Remove the ephemeral CI stack
        if: always()
        run: docker compose down -v
